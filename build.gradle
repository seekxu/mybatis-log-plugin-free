plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.18.1'
}

group = 'com.starxg'
version = '2.0.0'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    intellijPlatform {
        def localIdeaPath = providers.gradleProperty('localIdeaPath')
        if (localIdeaPath.isPresent()) {
            local localIdeaPath.get()
        } else {
            intellijIdea '2024.1'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.encoding = 'UTF-8'
}

intellijPlatform {
    buildSearchableOptions = false

    pluginConfiguration {
        ideaVersion {
            sinceBuild = '241'
            untilBuild = '262.*'
        }

        changeNotes = """
<dl>
    <dt><b>2.0.0</b></dt>
    <dd>Refactored to independent ToolWindow architecture (bottom panel)</dd>
    <dd>Supports IntelliJ IDEA 2024.1 - 2026.2</dd>
    <dd>Multi-thread concurrent SQL pairing (Map cache by logger source)</dd>
    <dd>Added WITH/EXPLAIN SQL type recognition and coloring</dd>
    <dd>Flexible log format compatibility (3-tier source extraction)</dd>
    <dd>Thread safety fixes: ConcurrentHashMap, CopyOnWriteArrayList, volatile</dd>
    <dd>Memory safety: console auto-trim at 10000 lines</dd>
    <dd>Performance: throttled cleanup, ThreadLocal Matcher reuse</dd>
    <dd>Clear All now resets sequence counter</dd>
    <dd>Copy SQL: one-click copy current SQL entry (regex-based, cursor anywhere)</dd>
</dl>
        """
    }
}